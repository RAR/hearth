<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1420">
  <title>Echo Dashboard Config</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <!-- Login gate. Hidden via the .hidden property in app.js; the [hidden] rule below wins over display. -->
  <div id="login" class="overlay">
    <form id="login-form" class="login-card card">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5.5"/>
          <path d="M8.5 15a4.2 4.2 0 0 1 0-6"/>
          <path d="M15.5 9a4.2 4.2 0 0 1 0 6"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <h1>Echo Dashboard</h1>
      <label for="pin">Enter the PIN shown on the device</label>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
      <button type="submit" class="btn-primary btn-block">Unlock</button>
      <div id="login-error" class="error" role="alert"></div>
    </form>
  </div>

  <main id="app" hidden>
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark small" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5.5"/>
            <path d="M8.5 15a4.2 4.2 0 0 1 0-6"/>
            <path d="M15.5 9a4.2 4.2 0 0 1 0 6"/>
            <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Echo Dashboard</span>
          <span class="brand-sub">Configuration</span>
        </span>
      </div>
      <div class="actions">
        <span id="status" class="status" role="status" aria-live="polite"></span>
        <button id="save" class="btn-primary">Save</button>
      </div>
    </div>

    <div class="content">

      <!-- FUTURE "Setup" card (Home Assistant URL entry + Connect button) slots in here as
           another <section class="card-section">, no surrounding layout changes needed. -->

      <section id="panels-section" class="card-section">
        <div class="card-head">
          <span class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/>
            </svg>
          </span>
          <div class="card-titles">
            <h2>Panels</h2>
            <p>Choose which screens appear and the order they cycle in.</p>
          </div>
        </div>
        <div id="panels"></div>
      </section>

      <section id="entities-section" class="card-section">
        <div class="card-head">
          <span class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8h9"/><path d="M18 8h2"/><circle cx="15" cy="8" r="2.1"/>
              <path d="M4 16h2"/><path d="M11 16h9"/><circle cx="8" cy="16" r="2.1"/>
            </svg>
          </span>
          <div class="card-titles">
            <h2>Entities</h2>
            <p>Map Home Assistant entities to each panel.</p>
          </div>
        </div>
        <div id="entities"></div>
      </section>

      <section id="home-section" class="card-section">
        <div class="card-head">
          <span class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>
            </svg>
          </span>
          <div class="card-titles">
            <h2>Home screen</h2>
            <p>Idle behaviour, clock, and the photo slideshow.</p>
          </div>
        </div>
        <div id="home"></div>
      </section>

      <section id="options-section" class="card-section">
        <div class="card-head">
          <span class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/>
            </svg>
          </span>
          <div class="card-titles">
            <h2>Panel options</h2>
            <p>Fine-tune how the thermostat and forecast behave.</p>
          </div>
        </div>
        <div id="options"></div>
      </section>
    </div>
  </main>

  <!-- Shared datalists live here, built once per unique domain-set (see app.js). Never cleared on re-render. -->
  <div id="datalists" hidden></div>
</body>
</html>
